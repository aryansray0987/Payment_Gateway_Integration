<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razorpay Checkout</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; padding: 60px 16px; background: #f5f7fb; }
    .card { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 100%; max-width: 380px; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccd; border-radius: 6px; margin-bottom: 16px; font-size: 1rem; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 6px; background: #3399cc; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #message { margin-top: 16px; padding: 10px; border-radius: 6px; display: none; word-break: break-word; }
    #message.success { display: block; background: #e6f7ec; color: #1e7b3c; }
    #message.error { display: block; background: #fdecea; color: #b42318; }
    #message.info { display: block; background: #eef4ff; color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pay with Razorpay</h1>
    <label for="amount">Amount (INR)</label>
    <input id="amount" type="number" min="1" step="0.01" value="500" />
    <button id="pay-btn">Pay Now</button>
    <div id="message"></div>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/checkout.js"></script>
</body>
</html>
